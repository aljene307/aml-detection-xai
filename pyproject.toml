[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aml_xai"
version = "0.1.0"
description = "Détection explicable du blanchiment d'argent sur le jeu SAML-D"
authors = [{ name = "Mohamed Aljene" }]
license = "MIT"
requires-python = ">=3.11,<3.12"
# Les versions sont figées dans les fichiers requirements*.txt.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
